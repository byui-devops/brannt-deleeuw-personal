
name: Build & Test & Push Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      # Prefer DOCKER_IMAGE_REPO secret; else fall back to brannt-deleeuw-personal under your DockerHub user
      IMAGE_REPO: ${{ secrets.DOCKER_IMAGE_REPO || format('docker.io/{0}/brannt-deleeuw-personal', secrets.DOCKERHUB_USERNAME) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run unit tests
        run: |
          pytest -q tests/test_unit.py

      - name: Build Docker image (local tag)
        run: |
          docker build -t local/app:${{ github.sha }} .
          docker tag local/app:${{ github.sha }} local/app:latest

      - name: Run integration tests (container)
        run: |
          docker run -d -p 9999:5000 --name app-under-test local/app:${{ github.sha }}
          python - <<'PY'
import time, requests
for _ in range(30):
    try:
        r = requests.get('http://127.0.0.1:9999/health', timeout=1)
        if r.status_code == 200:
            assert r.json()['status'] == 'ok'
            break
    except Exception:
        time.sleep(1)
else:
    raise SystemExit('Health check failed')
PY
          docker rm -f app-under-test

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag & Push image to Docker Hub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG=""
          docker tag local/app:${{ github.sha }} $IMAGE_REPO:${{ github.sha }}
          docker tag local/app:${{ github.sha }} $IMAGE_REPO:latest

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            docker tag local/app:${{ github.sha }} $IMAGE_REPO:${TAG}
          fi

          docker push $IMAGE_REPO:${{ github.sha }}
          docker push $IMAGE_REPO:latest
          if [[ -n "$TAG" ]]; then docker push $IMAGE_REPO:${TAG}; fi
